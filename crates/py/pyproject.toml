[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "peazero-rs"
description = "Rust core of the PeaZero trainer: self-play game pool and replay buffer"
requires-python = ">=3.9"
dependencies = ["numpy"]

[tool.maturin]
module-name = "peazero_rs"
features = ["pyo3/extension-module"]
