[package]
name = "peazero-py"
description = "Python bindings (self-play pool + replay buffer) for the PeaZero trainer"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "peazero_rs"
crate-type = ["cdylib"]

[dependencies]
peazero-core = { path = "../core" }
peazero-selfplay = { path = "../selfplay" }
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py39"] }
numpy = "0.30"
