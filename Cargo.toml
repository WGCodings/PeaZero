[workspace]
members = ["crates/core", "engine"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["WG"]
license = "GPL-3.0-or-later"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false

# Tests run with `cargo test --release`; keep them fast but unwinding.
[profile.test]
opt-level = 3
